function starPath(c, s) {
  const [cx, cy] = STAR.c, tips = STAR.tips;
  c.beginPath();
  tips.forEach((p, i) => {
    const q = tips[(i + 1) % 4];
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    const ctrl = [cx + (mx - cx) * .1, cy + (my - cy) * .1];
    const P = [cx + (p[0] - cx) * s, cy + (p[1] - cy) * s];
    const Q = [cx + (q[0] - cx) * s, cy + (q[1] - cy) * s];
    const C = [cx + (ctrl[0] - cx) * s, cy + (ctrl[1] - cy) * s];
    if (i === 0) c.moveTo(P[0], P[1]);
    c.quadraticCurveTo(C[0], C[1], Q[0], Q[1]);
  });
  c.closePath();
}

// Draws a layer as a band that follows its ellipse. The width profile is shifted
// round the path by d (clockwise), while the centre line eases to a clean ellipse.
function bandAt(c, E, d, flat, alpha) {
  const n = E.c.length, shift = d / (Math.PI * 2) * n;
  let cm = 0; for (let i = 0; i < n; i++) cm += E.c[i]; cm /= n;
  const pt = (i, sgn) => {
    const f = ((i - shift) % n + n) % n, i0 = Math.floor(f), i1 = (i0 + 1) % n, w = f - i0;
    const h = E.h[i0] * (1 - w) + E.h[i1] * w;
    const cc = E.c[i % n] * (1 - flat) + cm * flat;
    const u = Math.PI * 2 * i / n, r = cc + sgn * h;
    const x = E.a * r * Math.cos(u), y = E.b * r * Math.sin(u);
    const ct = Math.cos(E.t), st = Math.sin(E.t);
    return [E.cx + x * ct - y * st, E.cy + x * st + y * ct];
  };
  c.save(); c.globalAlpha = alpha; c.fillStyle = '#000';
  c.beginPath();
  for (let i = 0; i <= n; i++) { const p = pt(i, 1); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
  c.closePath();
  c.moveTo(...pt(n, -1));
  for (let i = n; i >= 0; i--) { const p = pt(i, -1); c.lineTo(p[0], p[1]); }
  c.closePath();
  c.fill('nonzero');
  c.restore();
}

function layerAt(c, img, E, d, m, alpha) {
  if (m < 1) { c.globalAlpha = alpha * (1 - m); c.drawImage(img, 0, 0); c.globalAlpha = 1; }
  if (m > 0) bandAt(c, E, d, m, alpha * m);
}

function render(t) {
  t = ((t % LOOP) + LOOP) % LOOP;

  // timeline

  const dLoop = ph(1.8, 5.4) * TAU;               // tall loop follows a beat later

  const mR = seg(t, 0.95, 1.2) * (1 - seg(t, 4.6, 4.85));

  for (let k = 3; k >= 1; k--) {                   // motion trails

  ctx.fillRect(0, 0, S, S);
}

Promise.all([load('ring.png'), load('loop.png')]).then(([r, l]) => {
  ring = r; loop = l;
  window.renderAt = render;
  window.ready = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { render(parseFloat(q.get('t'))); return; }
  const t0 = performance.now();
  (function tick(n) { render((n - t0) / 1000); requestAnimationFrame(tick); })(t0);
});
</script>
</body>
</html>
