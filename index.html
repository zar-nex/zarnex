<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZARNEX HOLDING | Premier Global Builder-Operator Platform</title>
    <meta name="description" content="ZARNEX Holding operates as a premier builder-operator platform, orchestrating a diversified ecosystem of high-growth ventures across technology, infrastructure, and real estate development." />
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0a0a0a',
              accent: '#c5a059',
              'bg-main': '#050505',
              'text-main': '#f5f5f5',
              'text-muted': '#888888',
            },
            fontFamily: {
              'inter': ['Inter', 'sans-serif'],
              'outfit': ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary: #0a0a0a;
        --secondary: #1a1a1a;
        --accent: #c5a059;
        --accent-light: #d4af37;
        --bg-main: #050505;
        --bg-card: rgba(20, 20, 20, 0.7);
        --text-main: #f5f5f5;
        --text-muted: #888888;
        --border: rgba(255, 255, 255, 0.08);
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        font-family: 'Inter', sans-serif;
        color: #f5f5f5;
        overflow-x: hidden;
      }
      .glass-navbar {
        background: rgba(5, 5, 5, 0.8);
        backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .text-gradient {
        background: linear-gradient(135deg, #fff 0%, #c5a059 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nav-link {
        color: #f5f5f5;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        transition: all 0.3s ease;
        opacity: 0.7;
      }
      .nav-link:hover { color: #c5a059; opacity: 1; }
      .btn-primary {
         background: #c5a059;
         color: #0a0a0a;
         padding: 0.75rem 2rem;
         font-weight: 800;
         font-size: 0.75rem;
         text-transform: uppercase;
         letter-spacing: 0.1em;
         transition: all 0.4s ease;
         display: inline-flex;
         align-items: center;
         gap: 0.5rem;
         border-radius: 4px;
      }
      .btn-primary:hover {
         transform: translateY(-2px);
         box-shadow: 0 10px 20px -5px rgba(197, 160, 89, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
