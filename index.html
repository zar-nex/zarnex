<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZARNEX HOLDING | Premier Global Builder-Operator Platform</title>
    <meta name="description" content="ZARNEX Holding operates as a premier builder-operator platform, orchestrating a diversified ecosystem of high-growth ventures across technology, infrastructure, and real estate development." />
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#ffffff',
              secondary: '#f5f5f7',
              accent: '#d4af37',
              'bg-main': '#ffffff',
              'text-main': '#1d1d1f',
              'text-muted': '#86868b',
            },
            fontFamily: {
              'inter': ['Inter', 'sans-serif'],
              'outfit': ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary: #ffffff;
        --secondary: #f5f5f7;
        --accent: #d4af37;
        --accent-light: #c5a059;
        --bg-main: #ffffff;
        --bg-card: rgba(255, 255, 255, 0.7);
        --text-main: #1d1d1f;
        --text-muted: #86868b;
        --border: rgba(0, 0, 0, 0.08);
      }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        font-family: 'Inter', sans-serif;
        color: #1d1d1f;
        overflow-x: hidden;
      }
      .glass-navbar {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      .text-gradient {
        background: linear-gradient(135deg, #d4af37 0%, #86868b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nav-link {
        color: #1d1d1f;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        transition: all 0.3s ease;
        opacity: 0.7;
      }
      .nav-link:hover { color: #d4af37; opacity: 1; }
      .btn-primary {
         background: #1d1d1f;
         color: #ffffff;
         padding: 0.75rem 2rem;
         font-weight: 800;
         font-size: 0.75rem;
         text-transform: uppercase;
         letter-spacing: 0.1em;
         transition: all 0.4s ease;
         display: inline-flex;
         align-items: center;
         gap: 0.5rem;
         border-radius: 999px;
      }
      .btn-primary:hover {
         transform: translateY(-2px);
         background: #d4af37;
         color: #ffffff;
         box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
